send_learned_ir_command:
  target:
    entity:
      domain: remote
      integration: tuya_local
  fields:
    command:
      required: true
      example: "Play"
      selector:
        object:
    device:
      example: "TV"
      selector:
        text:
    emitter_entity_id:
      example: "infrared.my_ir_emitter"
      required: true
      selector:
        entity:
          filter:
            domain: infrared

update_dps:
  name: "Update DPs"
  description: "Advanced: Request the device to report current values for specified datapoints (sends UPDATEDPS 0x12 command). For most use cases, prefer refresh_entities instead."
  fields:
    device_id:
      name: "Device ID"
      description: The Tuya device ID to request updated DP values from
      required: true
      example: 11100118278aab4de001
      selector:
        text:
    dps:
      name: "DPs"
      description: "List of DP indexes to refresh. If omitted, the device's force_dps list will be used, or defaults to [18, 19, 20]."
      required: false
      example: "[18, 19, 20]"
      selector:
        object:

refresh_entities:
  name: "Refresh Entities"
  description: "Refresh the state of one or more tuya_local entities by requesting their DPs from the device. Entities from the same device are batched into a single request."
  fields:
    entity_id:
      name: "Entities"
      description: "One or more tuya_local entities to refresh."
      required: true
      example: "sensor.my_plug_current"
      selector:
        entity:
          integration: tuya_local
          multiple: true
