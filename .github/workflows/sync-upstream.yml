name: Sync with upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/expose-update-dps-service
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and rebase
        run: |
          git remote add upstream https://github.com/make-all/tuya-local.git
          git fetch upstream main
          git rebase upstream/main

      - name: Check if there are new changes
        id: check
        run: |
          if git diff --quiet origin/feature/expose-update-dps-service; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push rebased branch
        if: steps.check.outputs.changed == 'true'
        run: git push --force-with-lease

      - name: Create release for HACS
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          TAG="v$(date +%Y.%-m.%-d)-update-dps"
          gh release delete "$TAG" --repo "$REPO" --yes 2>/dev/null || true
          git tag -f "$TAG"
          git push origin "$TAG" --force
          gh release create "$TAG" --repo "$REPO" --target feature/expose-update-dps-service --title "tuya-local + update_dps (synced $(date +%Y-%m-%d))" --notes "Auto-synced with upstream make-all/tuya-local + update_dps service patch."
